name: build-camoufox-image

on:
  workflow_dispatch: {}
  schedule:
    - cron: '17 3 * * 1'  # weekly, Monday 03:17 UTC — tracks upstream releases

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Clone upstream crw source
        run: git clone --depth 1 https://github.com/us/crw.git upstream

      # 遍历应用本仓库根目录下的所有 *.patch（按文件名排序），
      # 新增一个补丁只需放个文件，不用再改这里。
      - name: Apply patches
        run: |
          for p in ../*.patch; do
            echo "applying $p"
            git -C upstream apply --verbose "$p"
          done

      - name: Record upstream commit
        id: upstream
        run: echo "sha=$(git -C upstream rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push crw with the camoufox feature enabled
        uses: docker/build-push-action@v5
        with:
          context: ./upstream
          build-args: |
            CARGO_PKGS=-p crw-server --features cdp,camoufox -p crw-mcp -p crw-cli
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/crw-camoufox:latest
            ghcr.io/${{ github.repository_owner }}/crw-camoufox:${{ steps.upstream.outputs.sha }}
